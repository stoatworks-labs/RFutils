name: release-desktop

# Builds the RFutils desktop app for every platform and attaches the installers
# to the release.
#
# release.yml already ships the portable Node bundle and release-macos.yml an
# unsigned/notarised macOS .dmg — but nothing produced a Windows or Linux
# desktop build, so the desktop app was macOS-only. This closes that.
#
# Tauri cannot cross-compile its bundles, and the launcher embeds a Node runtime
# plus native prebuilds matched to the target (launcher/scripts/prepare.sh takes
# NODE_PLATFORM), so each platform must build on its own runner. That is exactly
# what CI is good for and what a single Mac cannot do.
#
# Modelled on atem-overseer's release-desktop.yml, which is the working
# reference for this launcher shape.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach installers to (e.g. v0.3.1)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE macOS build for both architectures: Tauri's
          # universal-apple-darwin target lipos the two slices, and
          # NODE_PLATFORM=darwin-universal makes prepare.sh lipo the embedded
          # Node runtime to match. A fat app around a thin runtime would launch
          # on an Intel Mac and then fail to start its server, which is exactly
          # what the old macos-x86_64 row shipped.
          #
          # rust_target is what rustup installs (universal-apple-darwin is a
          # Tauri bundling target, not a rustup one); tauri_target is what
          # `tauri build` is given and what names the output directory.
          - { name: macos-universal, os: macos-14,       node_platform: darwin-universal, rust_target: 'aarch64-apple-darwin,x86_64-apple-darwin', tauri_target: universal-apple-darwin, bundles: app }
          - { name: windows-x86_64, os: windows-latest, node_platform: win-x64,      rust_target: x86_64-pc-windows-msvc, bundles: 'nsis,msi' }
          - { name: linux-x86_64,   os: ubuntu-22.04,   node_platform: linux-x64,    rust_target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install launcher deps
        run: cd launcher && npm ci

      - name: Build and stage the embedded app
        shell: bash
        # prepare.sh fetches a self-contained Node for NODE_PLATFORM and installs
        # the production node_modules with that platform's native prebuilds —
        # which is why this cannot be cross-built.
        env:
          NODE_PLATFORM: ${{ matrix.node_platform }}
        run: cd launcher && bash scripts/prepare.sh

      - name: Build desktop bundle
        shell: bash
        # tauri.conf.json only lists app,dmg, so the bundles are named
        # explicitly per platform rather than relying on the config.
        run: cd launcher && npx --no-install tauri build --target ${{ matrix.tauri_target || matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # The x86_64 job is a cross-compile, so its target directory holds both
      # host and target artefacts — and the embedded Node runtime (~111 MB) is
      # then copied into the .app, the staging dir and the disk image in turn.
      # That was enough to exhaust the runner: hdiutil failed with "No space
      # left on device" while the aarch64 job, with the same payload, was fine.
      # The bundle is already built by this point; the intermediates are not
      # needed again.
      - name: Reclaim disk before packaging
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # A universal build compiles under the two REAL triples and lipos the
          # result into target/universal-apple-darwin, so the intermediates
          # worth deleting are the per-arch ones — twice as much as before, on
          # the job that already ran a runner out of space once.
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            d="launcher/src-tauri/target/$t/release"
            rm -rf "$d/build" "$d/deps" "$d/incremental" "$d/.fingerprint"
          done
          df -h / | tail -1

      # EVERY Mach-O in the bundle, not just Contents/MacOS/<exe>. This app
      # embeds a Node runtime, and a fat wrapper around a thin runtime launches
      # on an Intel Mac and then dies when it starts its server — which is
      # precisely the bug the shipped v0.4.3 x86_64 build had. Checking only the
      # main executable would have passed it.
      #
      # Captured and matched with `case`, never piped into grep: steps run as
      # `bash -eo pipefail`, so grep exiting at its first match SIGPIPEs lipo
      # and fails the step BECAUSE the match was found.
      - name: Verify the macOS bundle is universal
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          appdir="launcher/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/macos"
          app="RFutils.app"
          [ -d "$appdir/$app" ] || { echo "no .app produced" >&2; exit 1; }
          found=0
          while IFS= read -r f; do
            __archs="$( lipo -archs "$f" 2>/dev/null )" || continue
            [ -n "$__archs" ] || continue
            found=$((found+1))
            echo "${f#$appdir/$app/}: $__archs"
            case "$__archs" in
              *arm64*) ;;
              *) echo "expected an arm64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
            case "$__archs" in
              *x86_64*) ;;
              *) echo "expected an x86_64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
          done < <(find "$appdir/$app" -type f -perm -u+x)
          # A find that matched nothing would pass every check above in silence.
          # This bundle must have at least the app binary and the node runtime.
          if [ "$found" -lt 2 ]; then
            echo "expected at least the app binary and the embedded node, found $found" >&2
            exit 1
          fi

      - name: Installers (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        # Built here rather than by Tauri: its dmg step drives Finder over
        # AppleScript and fails headless, and it has no pkg bundler at all.
        # Ad-hoc signing first — the bundle nests an embedded Node binary, and
        # approving the outer app does not unquarantine it.
        run: |
          source scripts/release-lib.sh
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          case "$version" in [0-9]*) ;; *) version="$(node -p "require('./package.json').version")" ;; esac
          rl_init "RFutils" rfutils "$version" com.stoatworks.rfutils "$GITHUB_WORKSPACE/out"
          appdir="launcher/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/macos"
          app="RFutils.app"
          if [ ! -d "$appdir/$app" ]; then echo "no .app produced" >&2; exit 1; fi
          stage="$RUNNER_TEMP/stage-mac"
          rm -rf "$stage"; mkdir -p "$stage" "$GITHUB_WORKSPACE/out"
          cp -R "$appdir/$app" "$stage/"
          rl_adhoc_sign "$stage/$app"
          rl_dmg "${{ matrix.name }}" "$stage" --app "$app"
          rl_pkg "${{ matrix.name }}" "$stage" --app "$app"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find launcher/src-tauri/target -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -path '*/release/bundle/*' -exec cp {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: rfutils-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: warn

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # release.yml may still be creating the release; wait rather than race it.
          # Create the release if nothing has yet. This used to poll for one for five
          # minutes and then fail with "release not found", which is exactly what
          # happens whenever the job that creates it is still queued behind a busy
          # runner queue -- the build phase above reads green and the upload is the
          # only thing that fails. --verify-tag refuses to invent a tag that is not
          # pushed, and the `||` keeps it harmless when another job wins the race.
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $extra || true
          gh release upload "$TAG" out/* --clobber
