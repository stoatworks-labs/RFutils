<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RFutils</title>
    <meta name="description" content="A browser-based RF suite for radio mics: Wireless Workbench, WSM and Ofcom PMSE file exchange, plus IM-aware frequency coordination. Nothing is uploaded — the parsers and the coordination engine run on your own machine.">
    <link rel="canonical" href="https://rfutils.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://rfutils.stoatworks-labs.com/">
    <meta property="og:title" content="RFutils">
    <meta property="og:description" content="A browser-based RF suite for radio mics: Wireless Workbench, WSM and Ofcom PMSE file exchange, plus IM-aware frequency coordination. Nothing is uploaded — the parsers and the coordination engine run on your own machine.">
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/rfutils.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="RFutils">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/rfutils.png">
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tints the status bar and the title bar once installed. -->
    <meta name="theme-color" content="#12141a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="RFutils"
      data-repo="https://github.com/stoatworks-labs/RFutils"
    ></script>
    <!--
      No data-note here: this index.html is shared by both builds (the hosted
      browser-only one and the local server one, split only by
      VITE_RFUTILS_STATIC), so a "nothing is uploaded" line would be true of one
      and false of the other.
    -->
  </body>
</html>
