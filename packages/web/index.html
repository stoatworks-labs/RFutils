  <body>
    <noscript>
      <h1>RFutils</h1>
      <p>An RF suite for radio mics. The conversion and coordination half runs entirely in a browser: drop in a Wireless Workbench or WSM export, or an Ofcom PMSE licence PDF, and get your files back. Nothing is uploaded: the parsers, the .shw generator and the coordination engine all run on your own machine, in the page.</p>
      <p>In a browser it has Convert, Coordination, Inventory and Allocation. Monitor and Deployment (discovering receivers, decoding AES67 audio and programming frequencies) need sockets a web page can't open, so for those you run RFutils locally.</p>
      <p>It needs JavaScript to run.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/web-tools/rfutils/">RFutils on Stoatworks Labs</a></li>
        <li><a href="https://stoatworks-labs.com/software/rfutils/">Project page</a></li>
        <li><a href="https://stoatworks-labs.com/software/rfutils/guide/">User guide</a></li>
        <li><a href="https://github.com/stoatworks-labs/RFutils">Source code on GitHub</a></li>
      </ul>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->

    <script src="/about.js" defer></script>

      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="RFutils"
      data-repo="https://github.com/stoatworks-labs/RFutils"
    ></script>
    <!--
      No data-note here: this index.html is shared by both builds (the hosted
      browser-only one and the local server one, split only by
      VITE_RFUTILS_STATIC), so a "nothing is uploaded" line would be true of one
      and false of the other.
    -->
